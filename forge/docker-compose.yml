services:
  venom:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - venom-data:/app/storage
    environment:
      - VENOM_SECRET_KEY=${VENOM_SECRET_KEY:-change-me}
      - VENOM_ADMIN_USER=${VENOM_ADMIN_USER:-admin}
      - VENOM_ADMIN_PASSWORD=${VENOM_ADMIN_PASSWORD:-admin}

volumes:
  venom-data:
